name: Verify hardened plugin

on:
  push:
    branches: [main, 'hardening/**']
    paths:
      - 'Moon Animator 2 (v34000).rbxm'
      - 'hardening/**'
      - '.github/workflows/verify-hardening.yml'
  pull_request:
    paths:
      - 'Moon Animator 2 (v34000).rbxm'
      - 'hardening/**'
      - '.github/workflows/verify-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            /Moon Animator 2 (v34000).rbxm
            /hardening/
          sparse-checkout-cone-mode: false
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Download and verify the pinned Luau tools
        shell: bash
        run: |
          set -euo pipefail
          luau_dir="$RUNNER_TEMP/moon-luau"
          mkdir -p "$luau_dir"
          curl --fail --location --retry 3 \
            'https://github.com/luau-lang/luau/releases/download/0.743/luau-ubuntu.zip' \
            --output "$luau_dir/luau-ubuntu.zip"
          printf '%s  %s\n' \
            '99d45afb4afaee00ba631c526c8e8c76c67b60f6f119953ce6409be6d6953663' \
            "$luau_dir/luau-ubuntu.zip" | sha256sum --check --strict
          unzip -q "$luau_dir/luau-ubuntu.zip" -d "$luau_dir"
          chmod +x "$luau_dir/luau" "$luau_dir/luau-compile"
      - name: Test, rebuild, compare, and compile the plugin
        shell: bash
        run: python -B hardening/verify.py --luau-dir "$RUNNER_TEMP/moon-luau"
